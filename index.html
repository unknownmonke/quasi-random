<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quasi-random generator</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="main.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0" defer></script>
    <script src="main.js" defer></script>
    <script src="src/quasi-random.js" defer></script>
</head>
<body>
    <main>
        <section class="container">
            <label class="title" for="rgb-input">
                Generate RGB values. N = 
                <input id="rgb-input" type="text" maxlength="3" value="10">
                <span>&nbsp; (max 100 from a pool of 10 000).</span>
            </label>
            <div class="preview-container"></div>
        </section>
        <section class="container">
            <label class="title" for="graph-input">
                Example distribution. N = 
                <input id="graph-input" type="text" maxlength="4" value="200">
                <span>&nbsp; (max 1000).</span>
            </label>
            <div class="chart-container">
                <canvas id="distribution-graph"></canvas>
            </div>
        </section>
    </main>
</body>
</html>
