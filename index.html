<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quasi-random generator</title>
    <link rel="stylesheet" href="main.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
</head>
<body>
    <div class="container">
        <span class="title">Generated values preview</span>
        <div class="preview-container">
            <div id="1" class="preview"></div>
            <div id="2" class="preview"></div>
            <div id="3" class="preview"></div>
            <div id="4" class="preview"></div>
            <div id="5" class="preview"></div>
            <div id="6" class="preview"></div>
            <div id="7" class="preview"></div>
            <div id="8" class="preview"></div>
            <div id="9" class="preview"></div>
            <div id="10" class="preview"></div>
        </div>
    </div>
    <div class="container">
        <span class="title">
            Example distribution. N = <input id="graph-input" type="text" maxlength="3" value="200">
        </span>
        <div class="chart-container">
            <canvas id="distribution-graph"></canvas>
        </div>
    </div>
    <script type="text/javascript" src="main.js"></script>
</body>
</html>
